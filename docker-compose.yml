version: "3.9"

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: biocontrol-db
    environment:
      POSTGRES_USER: biocontrol
      POSTGRES_PASSWORD: biocontrol_secret
      POSTGRES_DB: biocontrol_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biocontrol -d biocontrol_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-memory broker & queue
  redis:
    image: redis:7-alpine
    container_name: biocontrol-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # S3 Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: biocontrol-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # NestJS Backend API Gateway
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: biocontrol-server
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://biocontrol:biocontrol_secret@postgres:5432/biocontrol_prod?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET: "biocontrol-scans"
      AI_SERVICE_URL: "http://ai-service:8000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # FastAPI AI Computer Vision Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: biocontrol-ai
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  # Next.js Frontend Web Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: biocontrol-client
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  minio_data:
